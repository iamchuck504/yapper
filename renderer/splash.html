<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
<title>Yapper</title>
<style>
  @font-face {
    font-family: 'Geist';
    src: url('fonts/Geist-latin.woff2') format('woff2');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'Geist';
    src: url('fonts/Geist-latin.woff2') format('woff2');
    font-weight: 600; font-style: normal;
  }

  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Geist', system-ui, sans-serif;
    -webkit-app-region: drag;
  }

  .card {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px;
    background: #1E1F16;
    border: 1px solid rgba(241, 240, 228, 0.10);
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
    opacity: 1;
    transform: scale(1);
    transition: opacity 260ms ease, transform 260ms ease;
  }
  /* main flips this on to hand over to the app window */
  body.leaving .card { opacity: 0; transform: scale(0.96); }

  /* the app icon, animated: cream bars on the sage -> olive squircle */
  .mark {
    width: 108px; height: 108px;
    border-radius: 26px;
    background: linear-gradient(135deg, #7D8D86 0%, #363724 100%);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(241, 240, 228, 0.14);
    display: flex; align-items: center; justify-content: center;
  }
  .wave { display: flex; align-items: center; gap: 4.5px; height: 56px; }
  .wave i {
    display: block;
    width: 7px;
    border-radius: 4px;
    background: #F1F0E4;
    transform-origin: center;
    animation: wave 1.05s ease-in-out infinite;
  }
  /* peak heights trace the icon's silhouette */
  .wave i:nth-child(1) { height: 34%; animation-delay: 0.00s; }
  .wave i:nth-child(2) { height: 62%; animation-delay: 0.10s; }
  .wave i:nth-child(3) { height: 92%; animation-delay: 0.20s; }
  .wave i:nth-child(4) { height: 100%; animation-delay: 0.30s; }
  .wave i:nth-child(5) { height: 72%; animation-delay: 0.40s; }
  .wave i:nth-child(6) { height: 46%; animation-delay: 0.50s; }
  .wave i:nth-child(7) { height: 28%; animation-delay: 0.60s; }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.28); opacity: 0.8; }
    50%      { transform: scaleY(1);    opacity: 1; }
  }

  .brand { font-size: 21px; font-weight: 600; color: #F1F0E4; letter-spacing: 0.2px; }
  #status {
    font-size: 12.5px; color: #8E9078; letter-spacing: 0.02em;
    min-height: 16px; margin-top: -10px;
  }
  .dots::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
  }

  @media (prefers-reduced-motion: reduce) {
    .wave i { animation: none; }
    .dots::after { animation: none; content: '…'; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="brand">Yapper</div>
    <!-- main writes the boot status straight into this node -->
    <div id="status" class="dots">Starting</div>
  </div>
</body>
</html>
