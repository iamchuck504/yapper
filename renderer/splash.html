<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
<title>Yapper</title>
<style>
  @font-face {
    font-family: 'Geist';
    src: url('fonts/Geist-latin.woff2') format('woff2');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'Geist';
    src: url('fonts/Geist-latin.woff2') format('woff2');
    font-weight: 600; font-style: normal;
  }

  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Geist', system-ui, sans-serif;
    -webkit-app-region: drag;
  }

  .card {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 40px;
    background: #0C0D10;
    border: 1px solid #191B20;
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    opacity: 1;
    transform: scale(1);
    transition: opacity 260ms ease, transform 260ms ease;
  }
  body.leaving .card { opacity: 0; transform: scale(0.96); }

  .mark { display: block; margin-bottom: 20px; border-radius: 12px; }
  .wm { font-size: 26px; font-weight: 650; color: #E6E8EC; letter-spacing: -0.02em; }
  .wm i { color: #E0A458; font-style: normal; margin-left: 1px; }

  /* a chapter rule with a playhead running along it — the app's own motif */
  .rule {
    position: relative;
    height: 1px;
    background: #1E2126;
    margin: 22px 0 14px;
    overflow: visible;
  }
  .rule::after {
    content: "";
    position: absolute;
    top: -1.5px;
    left: 0;
    width: 34px;
    height: 4px;
    background: #E0A458;
    border-radius: 2px;
    animation: sweep 2.1s cubic-bezier(.45,.05,.55,.95) infinite;
  }
  @keyframes sweep {
    0%   { left: 0;              opacity: 0; }
    12%  { opacity: 1; }
    88%  { opacity: 1; }
    100% { left: calc(100% - 34px); opacity: 0; }
  }

  #status {
    font-family: Consolas, 'Cascadia Mono', monospace;
    font-size: 11px;
    color: #5C626D;
    letter-spacing: 0.04em;
    min-height: 15px;
  }
  .dots::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rule::after { animation: none; opacity: 1; }
    .dots::after { animation: none; content: '…'; }
  }
</style>
</head>
<body>
  <div class="card">
    <!-- the app mark: two strokes merging into one -->
    <svg class="mark" viewBox="0 0 100 100" width="54" height="54" aria-hidden="true">
      <rect width="100" height="100" rx="22.5" fill="#E0A458"/>
      <g stroke="#0C0D10" stroke-width="11.5" stroke-linecap="round" fill="none">
        <path d="M27 28 L50 55"/>
        <path d="M73 28 L50 55"/>
        <path d="M50 55 L50 75"/>
      </g>
    </svg>
    <div class="wm">Yapper<i>/</i></div>
    <div class="rule"></div>
    <!-- main writes the boot status straight into this node -->
    <div id="status" class="dots">Starting</div>
  </div>
</body>
</html>
